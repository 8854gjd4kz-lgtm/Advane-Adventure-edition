<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Advanced Adventure Edition</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07101a;color:#fff;font:14px system-ui,-apple-system,sans-serif;touch-action:none}canvas{position:fixed;inset:0}.ui{position:fixed;inset:0;pointer-events:none}.p{background:#07101ad9;border:1px solid #ffffff25;border-radius:13px;backdrop-filter:blur(7px);box-shadow:0 8px 25px #0007}.top{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:7px}.stats{padding:8px 10px;min-width:170px}.b{height:6px;background:#0009;border-radius:5px;overflow:hidden;margin:3px 0}.f{height:100%;width:100%}.hp{background:#ef5366}.xp{background:#55b9ff}.sp{flex:1}.btn{pointer-events:auto;border:1px solid #ffffff35;background:#0a1222e8;color:#fff;border-radius:10px;padding:9px 11px;font-weight:900}.quest{position:absolute;top:86px;left:8px;max-width:300px;padding:9px;font-size:11px}.gold{color:#ffd76a;font-weight:900}.combat{position:absolute;left:8px;right:8px;bottom:8px;display:flex;align-items:end;justify-content:space-between;gap:7px}.pad{display:grid;grid-template-columns:45px 45px 45px;grid-template-rows:45px 45px;gap:4px;pointer-events:auto}.pad button:nth-child(1){grid-column:2}.pad button:nth-child(2){grid-column:1;grid-row:2}.pad button:nth-child(3){grid-column:2;grid-row:2}.pad button:nth-child(4){grid-column:3;grid-row:2}.round{width:45px;height:45px;border-radius:50%;font-size:17px}.atk{width:72px;height:72px;border-radius:50%;background:#7e263be8}.skills{display:flex;flex-wrap:wrap;justify-content:end;gap:4px;max-width:220px;pointer-events:auto}.skill{width:48px;height:48px;border-radius:9px;background:#121b2ee8;color:#fff;border:1px solid #ffffff30;font-size:8px;font-weight:900}.skill b{display:block;color:#ffd76a;font-size:12px}.target{position:absolute;top:39%;left:50%;transform:translate(-50%,-50%);text-align:center;text-shadow:0 2px 4px #000;pointer-events:none}.tbar{width:170px;height:6px;background:#000b;border-radius:6px;overflow:hidden}.tbar i{display:block;height:100%;background:#ef5366}.toast{position:absolute;bottom:160px;left:50%;transform:translateX(-50%);padding:8px 11px;opacity:0;transition:.2s}.show{opacity:1}.lobby{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;overflow:auto;padding:15px;background:radial-gradient(circle at 50% 15%,#284675,#0e172a 45%,#03050a)}.li{width:min(950px,100%);text-align:center}.logo{font-size:clamp(28px,7vw,64px);font-weight:1000;letter-spacing:2px;text-shadow:0 10px 30px #000}.sub{opacity:.75;margin:5px 0 16px}.classes{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.card{pointer-events:auto;text-align:left;min-height:92px;padding:9px;background:#07101ddd;color:#fff;border:1px solid #ffffff20;border-radius:12px}.card.sel{outline:2px solid #ffd76a;background:#1c1a10}.ico{font-size:24px}.cn{font-weight:1000}.role{font-size:10px;opacity:.7}.start{pointer-events:auto;margin-top:14px;padding:12px 22px;border:0;border-radius:11px;background:linear-gradient(135deg,#ffd76a,#ff9e42);font-weight:1000}.modal{position:fixed;inset:0;z-index:6;display:none;align-items:center;justify-content:center;padding:15px;background:#0009}.box{max-width:760px;width:100%;max-height:88vh;overflow:auto;padding:15px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.item{padding:8px;background:#ffffff08;border:1px solid #ffffff18;border-radius:9px}@media(max-width:650px){.classes{grid-template-columns:repeat(2,1fr)}.card{min-height:80px}.stats{min-width:145px}.skills{max-width:175px}.skill{width:44px;height:44px}}
</style></head><body><canvas id="c"></canvas><div id="lobby" class="lobby"><div class="li"><div class="logo">ADVANCED ADVENTURE EDITION</div><div class="sub">Seamless 3D open-world action RPG • fast combat • swap classes anytime</div><div id="classes" class="classes"></div><button id="start" class="start">ENTER THE WORLD</button><div class="sub">10 classes • 200 skills • 140 main creatures/NPCs • 40 peaceful creatures • 18 bosses • level 100</div></div></div><div class="ui"><div class="top"><div class="p stats"><b id="cls">Ranger</b> <small id="lv">Lv 1</small><div class="b"><i id="hf" class="f hp"></i></div><small id="ht">100/100 HP</small><div class="b"><i id="xf" class="f xp"></i></div><small id="xt">0/112 XP</small></div><div class="sp"></div><button id="swap" class="btn">CLASS</button><button id="bag" class="btn">BAG</button></div><div class="p quest"><b class="gold">THE BROKEN STAR</b><div id="q">Choose a class and enter the world.</div></div><div id="target" class="target"></div><div id="toast" class="p toast"></div><div class="combat"><div class="pad"><button class="btn round" data-m="f">▲</button><button class="btn round" data-m="l">◀</button><button class="btn round" data-m="b">▼</button><button class="btn round" data-m="r">▶</button></div><button id="atk" class="btn round atk">ATTACK</button><div id="skills" class="skills"></div></div></div><div id="modal" class="modal"><div class="p box"><button id="close" class="btn" style="float:right">CLOSE</button><h2 id="mt">Menu</h2><div id="mb"></div></div></div>
<script type="module">import*as T from'https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js';
const C={Ranger:['🏹','Ranged / mobility',0x55d66f],Warrior:['🛡️','Tank / melee',0xd8a13b],Assassin:['🗡️','Burst / stealth',0xa45bff],Reaper:['☠️','Soul / lifesteal',0x73d4d4],Mage:['🔮','Magic / AOE',0x61a5ff],Paladin:['✨','Holy / defense',0xffe28a],Necro:['💀','Summon / plague',0x88e06d],Gunslinger:['🔫','Rapid ranged',0xffb36b],Berserker:['🪓','Rage / heavy melee',0xff6b4f],Samurai:['⚔️','Precision / parry',0xff6b73ff]};
const SS=['Mark','Volley','Piercer','Rush','Storm','Trap','Focus','Fang','Barrage','Arrowfall','Step','Flurry','Guard','Breaker','Surge','Tempest','Strike','Nova','Finisher','Ultimate'];const SK={};for(const n in C)SK[n]=SS.map((s,i)=>{const p={Ranger:['Hunter','Wind','Eagle','Primal'],Warrior:['Iron','Battle','Titan','Champion'],Assassin:['Shadow','Crimson','Phantom','Night'],Reaper:['Soul','Grave','Wraith','Doom'],Mage:['Arcane','Flame','Frost','Void'],Paladin:['Holy','Radiant','Sacred','Seraph'],Necro:['Bone','Rot','Grave','Lich'],Gunslinger:['Quick','Deadeye','Bullet','Outlaw'],Berserker:['Rage','Savage','Blood','World'],Samurai:['Moon','Dragon','Spirit','Shogun']}[n][i%4];return p+' '+s});
const B=[['Sunrise Grasslands',-1050,-600,0x65a84e],['Emerald Jungle',-350,-600,0x267a4c],['Volcanic Expanse',350,-600,0x6c3024],['Frozen Crown',1050,-600,0xb9dce7],['Pinefang Mountains',-700,350,0x63745c],['Tropical Coast',0,350,0xd0bd68],['Darkwood Forest',700,350,0x27352d],['Crystal Barrens',-1200,350,0x6f6798],['Ashen Highlands',1200,350,0x59555a],['Starfall Plains',0,-125,0x6e9852]];
const nouns=['Wolf','Drake','Stalker','Golem','Raptor','Brute','Serpent','Scout','Hunter','Keeper','Raider','Warden','Beast','Marauder'];const main=[];B.forEach((b,bi)=>nouns.forEach((n,i)=>main.push({n:b[0].split(' ')[0]+' '+n+' '+(i+1),b:bi,npc:i>=7})));const W=['Meadow Hare','Bluejay','Red Fox','Field Mouse','Golden Finch','Spotted Deer','River Otter','Tree Frog','Scarlet Macaw','Jungle Monkey','Toucan','Leaf Gecko','Parrotfish','Sea Turtle','Dolphin','Manta Ray','Butterfly','Firefly','Hummingbird','Snow Hare','Arctic Fox','Penguin','Mountain Goat','Eagle','Marmot','Pine Marten','Tropical Crab','Pelican','Flamingo','Boarlet','Glow Moth','Moon Rabbit','Crystal Beetle','Desert Lizard','Sand Finch','Ash Mouse','Raven','Dragonfly','Koi Spirit','Star Moth'];const BOS=['Gorath the Grass Titan','Maw of the Emerald Temple','Vulkrax the Living Volcano','Frost Queen Nivara','Grimpeak Colossus','Tidebreaker Leviathan','The Hollow Stag','Prism Sovereign','Ashen Warlock','Starfall Seraph','Dread Captain Malvek','The Bone Emperor','Stormblade Raijin','Infernal Matron Zhara','Nightmare Root','Voidfang Dragon','The Broken Star','Astrax the World Eater'];
const STORY=['A star falls over Starfall Plains.','The jungle temple has awakened.','The volcano is feeding the rift.','The Frozen Crown hides the second shard.','The mountains guard an ancient forge.','The coast reveals a drowned seal.','Darkwood remembers the old war.','Crystal Barrens mirror the sky.','Ashen Highlands hold the enemy camp.','The plains become a battlefield.','A dread captain rallies the armies.','The Bone Emperor opens the grave gate.','Raijin guards the storm shard.','Zhara protects the infernal shard.','Nightmare Root consumes the forest.','Voidfang tears the sky.','The Broken Star is within reach.','Astrax arrives to devour the world.'];
let scene,cam,rend,clock,ray,mouse,pg,sel=null;const EN=[],BO=[],AN=[],FX=[];const mv={f:0,b:0,l:0,r:0},key={};let cd=0,scd=0;const S={started:false,class:'Ranger',level:1,xp:0,hp:100,maxHp:100,gold:0,kills:0,loot:[],bosses:0};const save=()=>localStorage.setItem('aae3',JSON.stringify(S));try{Object.assign(S,JSON.parse(localStorage.getItem('aae3')||'{}'))}catch{};
function mat(c){return new T.MeshStandardMaterial({color:c,roughness:1})}function box(w,h,d,c){return new T.Mesh(new T.BoxGeometry(w,h,d),mat(c))}function orb(r,c){return new T.Mesh(new T.SphereGeometry(r,9,7),mat(c))}function char(c,k=1){let g=new T.Group(),b=box(.8,1.2,.55,c);b.position.y=1.2;g.add(b);let h=orb(.36,0xf0c4a0);h.position.y=2.05;g.add(h);for(const x of[-.24,.24]){let l=box(.18,.8,.18,0x222832);l.position.set(x,.4,0);g.add(l)}let w=box(.15,.9,.15,0xe2e2e2);w.position.set(.55,1.2,0);g.add(w);g.scale.setScalar(k);return g}
function world(){scene.background=new T.Color(0x8bc9e8);scene.fog=new T.Fog(0x8bc9e8,80,700);scene.add(new T.HemisphereLight(0xc8efff,0x30402f,1.8));let sun=new T.DirectionalLight(0xffefc8,2);sun.position.set(-200,400,200);scene.add(sun);let gr=new T.Mesh(new T.PlaneGeometry(3600,2600),mat(0x56864d));gr.rotation.x=-Math.PI/2;scene.add(gr);for(const b of B){let z=new T.Mesh(new T.CylinderGeometry(335,350,1.4,48),mat(b[3]));z.position.set(b[1],0,b[2]);scene.add(z);for(let i=0;i<14;i++){let a=i*2.4,r=80+(i%7)*30,o;if(b[0].includes('Pine')){o=box(.35,2,.35,0x65452b);o.position.set(b[1]+Math.cos(a)*r,1,b[2]+Math.sin(a)*r);scene.add(o);let t=new T.Mesh(new T.ConeGeometry(1.1,3,7),mat(0x315b39));t.position.set(o.position.x,3,o.position.z);scene.add(t)}else{let o=orb(1,b[3]^0x101010);o.position.set(b[1]+Math.cos(a)*r,1,b[2]+Math.sin(a)*r);scene.add(o)}}}for(const [x1,z1,x2,z2] of[[-1050,-600,-350,-600],[-350,-600,350,-600],[350,-600,1050,-600],[-700,350,0,350],[0,350,700,350],[-1200,350,-700,350],[700,350,1200,350],[0,-125,0,350],[-350,-600,0,-125],[350,-600,0,-125]]){let l=Math.hypot(x2-x1,z2-z1),r=box(l,.1,16,0x78684f);r.position.set((x1+x2)/2,.05,(z1+z2)/2);r.rotation.y=Math.atan2(z2-z1,x2-x1);scene.add(r)}}
function spawnMain(o,i){let b=B[o.b],a=i*2.41,r=70+i%8*27,g=char(C[S.class][2],.7+(i%4)*.06);g.position.set(b[1]+Math.cos(a)*r,0,b[2]+Math.sin(a)*r);g.userData={name:o.n,hp:65+(i%9)*12,max:65+(i%9)*12,damage:3+i%7,speed:.12+i%5*.025,alive:1,npc:o.npc};scene.add(g);EN.push(g)}function spawnBoss(n,i){let b=B[i%B.length],a=i*1.71,r=185,g=char(0x9d2538,1.65);g.position.set(b[1]+Math.cos(a)*r,0,b[2]+Math.sin(a)*r);g.userData={name:n,hp:900+i*150,max:900+i*150,damage:12+i,speed:.06,alive:1,boss:1};scene.add(g);BO.push(g)}function spawnAnimal(n,i){let b=B[i%B.length],a=i*2.13,r=100+i%5*20,g=orb(.35,0xb8c2a5);g.position.set(b[1]+Math.cos(a)*r,.35,b[2]+Math.sin(a)*r);g.scale.set(1.3,.7,1.4);g.userData.name=n;scene.add(g);AN.push(g)}
function fx(p,c){let m=new T.Mesh(new T.SphereGeometry(.12,7,6),new T.MeshBasicMaterial({color:c,transparent:true}));m.position.copy(p);m.position.y+=1.4;scene.add(m);FX.push({m,t:0})}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1500)}function need(){return 112+S.level*S.level*11}function hud(){document.getElementById('cls').textContent=S.class;document.getElementById('lv').textContent='Lv '+S.level;document.getElementById('hf').style.width=100*S.hp/S.maxHp+'%';document.getElementById('ht').textContent=Math.max(0,Math.floor(S.hp))+'/'+S.maxHp+' HP';document.getElementById('xf').style.width=(S.level==100?100:100*S.xp/need())+'%';document.getElementById('xt').textContent=S.level==100?'MAX LEVEL':Math.floor(S.xp)+'/'+need()+' XP';document.getElementById('q').textContent=S.bosses<18?STORY[S.bosses]+' Bosses defeated: '+S.bosses+'/18':'The Broken Star is shattered. Explore the seamless world and master every class.'}
function xp(n){S.xp+=n;while(S.level<100&&S.xp>=need()){S.xp-=need();S.level++;S.maxHp+=12;S.hp=S.maxHp;toast('LEVEL UP! Lv '+S.level)}if(S.level==100)S.xp=0;save();hud()}function near(){let q=null,d=999;for(const e of[...EN,...BO])if(e.userData.alive){let x=pg.position.distanceTo(e.position);if(x<d)d=x,q=e}return q}function hit(t,d){if(!t||!t.userData.alive)return;t.userData.hp-=d;fx(t.position,C[S.class][2]);if(t.userData.hp<=0){t.userData.alive=0;t.visible=0;let boss=!!t.userData.boss,reward=boss?1000:35+Math.random()*55|0;S.gold+=reward;S.kills++;S.loot.push((boss?'LEGENDARY ':'')+S.class+' '+['Blade','Armor','Charm','Relic','Rune'][Math.random()*5|0]);if(S.loot.length>35)S.loot.shift();xp(boss?1000:45+Math.random()*70|0);if(boss){S.bosses++;toast(t.userData.name+' defeated! +'+reward+'g')}else toast(t.userData.name+' defeated • +'+reward+'g');setTimeout(()=>{t.userData.hp=t.userData.max;t.userData.alive=1;t.visible=1},boss?12000:5000);sel=null;save()}}
function attack(){if(!S.started||cd)return;cd=.28;let t=sel&&sel.userData.alive?sel:near();if(!t)return;if(pg.position.distanceTo(t.position)>11){toast('Move closer');return}sel=t;hit(t,20+S.level*2)}function skill(i){if(!S.started||scd)return;scd=.5;let t=sel&&sel.userData.alive?sel:near();if(!t)return;if(pg.position.distanceTo(t.position)>14){toast('Move closer');return}hit(t,(24+S.level*2)*(1.35+i*.07));toast(SK[S.class][i])}
function player(){pg=char(C[S.class][2],1);scene.add(pg);cam.position.set(0,5.5,8)}function select(e){let r=rend.domElement.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*2-1;mouse.y=-(e.clientY-r.top)/r.height*2+1;ray.setFromCamera(mouse,cam);let h=ray.intersectObjects([...EN,...BO],true);if(h.length){let o=h[0].object;while(o.parent&&!o.userData.name)o=o.parent;if(o.userData.name){sel=o;target()}}}function target(){if(!sel)return;document.getElementById('target').innerHTML='<b>'+sel.userData.name+'</b><div class="tbar"><i style="width:'+100*sel.userData.hp/sel.userData.max+'%"></i></div>'}
function skills(){document.getElementById('skills').innerHTML=SK[S.class].slice(0,4).map((n,i)=>'<button class="skill" data-s="'+i+'"><b>'+(i+1)+'</b>'+n+'</button>').join('');document.querySelectorAll('[data-s]').forEach(b=>b.onpointerdown=e=>{e.preventDefault();skill(+b.dataset.s)})}
function menuSwap(){open('Swap Class',Object.entries(C).map(([n,d])=>'<button class="btn" data-c="'+n+'" style="margin:3px">'+d[0]+' '+n+'</button>').join('')+'<hr><div class="small">Each class has 20 skills. Switch instantly without leaving the world.</div>');document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{S.class=b.dataset.c;pg.children[0].material.color.setHex(C[S.class][2]);skills();hud();close();save();toast('Switched to '+S.class)})}function bag(){open('Loot • '+S.gold+' gold',S.loot.length?S.loot.slice().reverse().map(x=>'<div class="item">💎 <b>'+x+'</b></div>').join(''):'<div class="item">Defeat monsters and bosses to earn loot.</div>')}function open(t,b){document.getElementById('mt').textContent=t;document.getElementById('mb').innerHTML=b;document.getElementById('modal').style.display='flex'}function close(){document.getElementById('modal').style.display='none'}
function lobby(){let g=document.getElementById('classes');g.innerHTML=Object.entries(C).map(([n,d])=>'<button class="card" data-p="'+n+'"><div class="ico">'+d[0]+'</div><div class="cn">'+n+'</div><div class="role">'+d[1]+' • 20 skills</div></button>').join('');let pick=S.class;g.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{pick=b.dataset.p;g.querySelectorAll('.card').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')});g.querySelector('[data-p="'+pick+'"]').classList.add('sel');document.getElementById('start').onclick=()=>{S.class=pick;S.started=1;document.getElementById('lobby').style.display='none';player();skills();hud();save();toast('Welcome to the seamless continent!')}}
function move(){let z=(mv.f||key.KeyW?1:0)-(mv.b||key.KeyS?1:0),x=(mv.r||key.KeyD?1:0)-(mv.l||key.KeyA?1:0),v=new T.Vector3(x,0,z);if(v.lengthSq()){v.normalize().multiplyScalar(.34);pg.position.add(v);pg.rotation.y=Math.atan2(v.x,v.z)}pg.position.x=T.MathUtils.clamp(pg.position.x,-1720,1720);pg.position.z=T.MathUtils.clamp(pg.position.z,-1250,1250);cam.position.lerp(new T.Vector3(pg.position.x,5.6,pg.position.z+8.5),.08);cam.lookAt(pg.position.x,2.6,pg.position.z)}
function enemies(){for(const e of[...EN,...BO])if(e.userData.alive){let d=pg.position.distanceTo(e.position);if(d<18){let v=pg.position.clone().sub(e.position);v.y=0;if(v.length()>3){v.normalize();e.position.addScaledVector(v,e.userData.speed)}else if(Math.random()<.02){S.hp-=e.userData.damage;if(S.hp<=0){S.hp=S.maxHp;pg.position.set(0,0,0);toast('Defeated — returned to Starfall Plains')}}}}}function effects(dt){for(let i=FX.length-1;i>=0;i--){let f=FX[i];f.t+=dt;f.m.scale.setScalar(1+f.t*8);f.m.material.opacity=1-f.t*3;if(f.t>.34){scene.remove(f.m);FX.splice(i,1)}}}
function init(){lobby();rend=new T.WebGLRenderer({canvas:c,antialias:true,powerPreference:'high-performance'});rend.setPixelRatio(Math.min(devicePixelRatio,1.5));rend.setSize(innerWidth,innerHeight);scene=new T.Scene();cam=new T.PerspectiveCamera(60,innerWidth/innerHeight,.1,2200);clock=new T.Clock();ray=new T.Raycaster();mouse=new T.Vector2();world();main.forEach((o,i)=>spawnMain(o,i));BOS.forEach(spawnBoss);W.forEach(spawnAnimal);addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();rend.setSize(innerWidth,innerHeight)});c.onpointerdown=select;document.querySelectorAll('[data-m]').forEach(b=>{let k=b.dataset.m;b.onpointerdown=e=>{e.preventDefault();mv[k]=1};b.onpointerup=()=>mv[k]=0;b.onpointercancel=()=>mv[k]=0;b.onpointerleave=()=>mv[k]=0});addEventListener('keydown',e=>key[e.code]=1);addEventListener('keyup',e=>key[e.code]=0);document.getElementById('atk').onpointerdown=e=>{e.preventDefault();attack()};document.getElementById('swap').onclick=menuSwap;document.getElementById('bag').onclick=bag;document.getElementById('close').onclick=close;loop()}function loop(){requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.05);if(S.started){cd=Math.max(0,cd-dt);scd=Math.max(0,scd-dt);move();enemies();effects(dt);if(sel&&sel.userData.alive)target();else document.getElementById('target').innerHTML='';hud()}rend.render(scene,cam)}init();</script></body></html>
